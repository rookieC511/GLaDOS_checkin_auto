name: GLaDOS Checkin

on:
  schedule:
    # UTC 00:37 = Beijing 08:37. Avoid the busiest minute at the top of the hour.
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.5

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run check-in
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE || secrets.COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GLADOS_BASE_URL: https://glados.network
        run: python glados.py
